[package]
name = "nexus-mod-manager"
version = "0.1.0"
edition = "2021"

[features]
default = ["ui"]
ui = []

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_4", "gtk_v4_10"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
config = "0.14"
zip = { version = "0.6", features = ["deflate"] }
futures = "0.3"
async-channel = "2.0"
url = "2.5"
sha2 = "0.10"
hex = "0.4"
sevenz-rust = "0.6"
unrar = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3.10"
gio = "0.20"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"